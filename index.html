<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>간단 가계부</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>💰 간단 가계부</h1>
      <div class="month-nav">
        <button id="prevMonth" aria-label="이전 달">‹</button>
        <span id="currentMonth"></span>
        <button id="nextMonth" aria-label="다음 달">›</button>
      </div>
    </header>

    <section class="summary">
      <div class="card income">
        <span class="label">수입</span>
        <span class="value" id="totalIncome">0원</span>
      </div>
      <div class="card expense">
        <span class="label">지출</span>
        <span class="value" id="totalExpense">0원</span>
      </div>
      <div class="card balance">
        <span class="label">잔액</span>
        <span class="value" id="totalBalance">0원</span>
      </div>
    </section>

    <section class="form-section">
      <form id="txForm">
        <div class="tabs">
          <button type="button" class="tab active" data-type="expense">지출</button>
          <button type="button" class="tab" data-type="income">수입</button>
        </div>
        <div class="form-row">
          <input type="date" id="date" required>
          <select id="category" required></select>
        </div>
        <div class="form-row">
          <input type="number" id="amount" placeholder="금액" min="0" step="1" required>
          <input type="text" id="memo" placeholder="메모 (선택)">
        </div>
        <button type="submit" class="submit-btn">추가</button>
      </form>
    </section>

    <section class="list-section">
      <div class="list-header">
        <h2>내역</h2>
        <span id="txCount" class="count"></span>
      </div>
      <ul id="txList"></ul>
      <p id="emptyMsg" class="empty-msg" hidden>내역이 없습니다.</p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
